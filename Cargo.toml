[package]
name = "voidb-plugin-postgres"
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for PostgreSQL"
repository = "https://github.com/limmytian/voidb-plugin-postgres"

[[bin]]
name = "voidb-plugin-postgres"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", tag = "v0.3.1" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", tag = "v0.3.1", default-features = false }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
